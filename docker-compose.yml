# Profiles:
#   (none)      traefik, db, redis, backend, worker, worker-ocr, beat, frontend
#   production  + backup      (encrypted daily backups, needs AGE_RECIPIENT)
#   monitoring  + prometheus, blackbox, alertmanager, node-exporter, postgres-exporter
# Enable them with COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=production,monitoring)
# or --profile on the command line.

# Every container logs to json-file with rotation, so a chatty service cannot
# fill the disk during an event.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

# The application containers (backend image) run as the unprivileged user
# "app" (uid 10001, see backend/Dockerfile) with every Linux capability
# dropped and without privilege escalation. backend, worker, worker-ocr and
# beat also get a read-only root filesystem; they write only to their volumes
# and /tmp.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# One-shot init containers that hand volumes created by older (root) releases,
# or host directories created by root, to uid 10001. They run as root with
# only CHOWN and DAC_READ_SEARCH, no network, and exit.
x-ownership-init: &ownership-init
  build:
    context: ./backend
    dockerfile: Dockerfile
  user: "0:0"
  entrypoint: ["sh", "/app/scripts/fix-volume-ownership.sh"]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_READ_SEARCH]
  security_opt: ["no-new-privileges:true"]
  network_mode: none
  mem_limit: 128m
  restart: "no"
  logging: *default-logging

services:
  # ── Reverse Proxy ─────────────────────────────────────────────
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=false"
      # /ping for the container healthcheck (entrypoint "traefik", not published).
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.le.acme.email=${TRAEFIK_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certificates: /letsencrypt/acme.json inside the named volume
      # "letsencrypt" (docker compose exec traefik cat /letsencrypt/acme.json).
      - letsencrypt:/letsencrypt
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Database ──────────────────────────────────────────────────
  db:
    # The major version is part of the data format: moving to a new major needs
    # a dump and restore, which scripts/postgres-upgrade.sh does (update.sh
    # calls it). Keep backend/Dockerfile's PG_MAJOR (client tools) in step.
    image: postgres:18-alpine
    # After a migration the old cluster stays in the volume for a rollback. If
    # the old release ran on it again, the migrated copy is out of date: then
    # refuse to start until scripts/postgres-upgrade.sh --redo or --keep-new
    # has settled which data to use (see the marker it writes).
    entrypoint:
      - sh
      - -c
      - |
        marker="/var/lib/postgresql/$${PG_MAJOR}/botball-upgrade.info"
        if [ -s "$$marker" ]; then
          read -r old_dir old_major old_mtime stamp < "$$marker"
          if [ -s "$$old_dir/global/pg_control" ] \
            && [ "$$(stat -c %Y "$$old_dir/global/pg_control")" != "$$old_mtime" ]; then
            echo "The PostgreSQL $$old_major data in $$old_dir was used again after the migration to" >&2
            echo "PostgreSQL $${PG_MAJOR} ($$stamp). Refusing to start on the older copy; run" >&2
            echo "scripts/postgres-upgrade.sh --redo (or --keep-new), see docs/documentation/installation/update.md." >&2
            exit 1
          fi
        fi
        exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    # Proxmox LXC without nesting cannot create the Unix socket; proxmox-setup.sh
    # sets POSTGRES_UNIX_SOCKET_DIRECTORIES= (empty = TCP only) and creates the
    # role/database itself, because the image's init scripts need the socket.
    # Everywhere else keep the default so a fresh volume is initialised normally.
    command: postgres -c unix_socket_directories=${POSTGRES_UNIX_SOCKET_DIRECTORIES-/var/run/postgresql}
    env_file:
      - path: .env
        required: false   # optional so dev works without a .env file
    environment:
      # Defaults apply when no .env is present (dev).
      # On production .env overrides these via env_file above.
      POSTGRES_DB: ${POSTGRES_DB:-botball}
      POSTGRES_USER: ${POSTGRES_USER:-botball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botball}
    # PostgreSQL 18+ images keep the cluster in a major-specific subdirectory
    # (PGDATA=/var/lib/postgresql/18/docker), so the volume is mounted one
    # level up. Installations from PostgreSQL 16 have their old cluster at the
    # top of the same volume; the image refuses to start next to it until
    # scripts/postgres-upgrade.sh has migrated it (the old files stay as they
    # are, for a rollback).
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botball} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────
  backend:
    <<: *hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    read_only: true
    # Multipart uploads are spooled to /tmp (print files up to
    # PRINT_UPLOAD_MAX_MB); tmpfs pages count towards mem_limit.
    tmpfs:
      - /tmp:size=${BACKEND_TMP_SIZE:-512m}
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    env_file:
      - path: .env
        required: false   # optional so dev works without a .env file
    environment:
      REDIS_URL: redis://redis:6379/0
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-/app/vapid/private_key.pem}
      # The backend publishes no port; it is reached only through Traefik, which
      # discards client-sent X-Forwarded-For and sets the real client address.
      # Trusting the proxy header here gives the login rate limit and the audit
      # log the client IP instead of Traefik's (one shared bucket for everyone).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - uploads:/app/uploads
      - vapid:/app/vapid
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      # Metrics and readiness are internal: Prometheus, the Blackbox exporter
      # and the Docker healthchecks reach backend:8000 directly.
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`) && !Path(`/api/system/metrics`) && !Path(`/api/system/readiness`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.routers.api.service=api"
      # Request bodies above max(MAX_UPLOAD_SIZE_MB, PRINT_UPLOAD_MAX_MB) + 2 MB
      # are refused by Traefik already (413); the API enforces the exact
      # per-route limits itself while the body streams in. Raise
      # API_MAX_BODY_BYTES together with PRINT_UPLOAD_MAX_MB.
      - "traefik.http.routers.api.middlewares=api-body-limit"
      - "traefik.http.middlewares.api-body-limit.buffering.maxRequestBodyBytes=${API_MAX_BODY_BYTES:-106954752}"
      - "traefik.http.middlewares.api-body-limit.buffering.memRequestBodyBytes=2097152"
      # The live WebSockets (public per slug, authenticated per event id; no
      # request body) bypass the buffering middleware.
      - "traefik.http.routers.api-ws.rule=Host(`${DOMAIN}`) && PathRegexp(`^/api/v1/(public/events/[a-z0-9-]+|events/[A-Za-z0-9-]+)/ws$$`)"
      - "traefik.http.routers.api-ws.priority=1000"
      - "traefik.http.routers.api-ws.entrypoints=websecure"
      - "traefik.http.routers.api-ws.tls.certresolver=le"
      - "traefik.http.routers.api-ws.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      # Liveness only; /api/system/readiness (DB, Redis, worker) is probed by
      # Prometheus/Blackbox so a missing worker does not restart the API.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3m

  # ── Background workers (see core/celery_app.py for the queues) ─
  # worker: notifications, printer polling and other periodic jobs.
  # worker-ocr: score-sheet OCR only, so a pile of scans never delays them.
  worker:
    <<: *hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core.celery_app:celery_app worker -Q default,periodic --loglevel=INFO --concurrency=2
    read_only: true
    tmpfs:
      - /tmp:size=256m
    # No OCR here any more (worker-ocr); notifications, printer polling and
    # housekeeping need far less.
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      # The worker delivers Web Push, so it needs the same VAPID key as the API.
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-/app/vapid/private_key.pem}
      # OpenCV refuses to decode larger images (decompression bombs); the OCR
      # code checks the same 40 MP limit from the image header first.
      OPENCV_IO_MAX_IMAGE_PIXELS: "40000000"
    volumes:
      - uploads:/app/uploads
      - vapid:/app/vapid:ro
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app:celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker-ocr:
    <<: *hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core.celery_app:celery_app worker -Q ocr --loglevel=INFO --concurrency=2
    read_only: true
    tmpfs:
      - /tmp:size=256m
    # OCR of two score sheets at a time; a runaway decode is killed here
    # instead of taking the whole host down.
    mem_limit: ${OCR_WORKER_MEM_LIMIT:-2g}
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      # OpenCV refuses to decode larger images (decompression bombs); the OCR
      # code checks the same 40 MP limit from the image header first.
      OPENCV_IO_MAX_IMAGE_PIXELS: "40000000"
    # Scans and templates only; no VAPID key (this worker sends no push).
    volumes:
      - uploads:/app/uploads
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app:celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    <<: *hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    # The schedule file lives in the writable /tmp (the root is read-only).
    command: celery -A core.celery_app:celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: ${BEAT_MEM_LIMIT:-256m}
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Beat touches /tmp/celerybeat-heartbeat for every task the broker accepts
      # (the outbox task is due every 10 s); a stale file means beat hangs.
      test: ["CMD", "python", "scripts/beat_healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 2m

  # ── Encrypted backups (profile "production") ─────────────────
  # backup_scheduler.py runs scripts/backup.sh every BACKUP_INTERVAL_SECONDS,
  # retries a failed run after BACKUP_RETRY_SECONDS, turns the container
  # unhealthy when the last run failed or is older than BACKUP_MAX_AGE_HOURS
  # (default: interval + 2 h) and exposes botball_backup_* metrics on :9101
  # for Prometheus. With BACKUP_OFFSITE_TARGET it copies every new archive
  # off-site as well. Every BACKUP_RESTORE_TEST_INTERVAL_SECONDS (weekly) it
  # restores the newest archive into ${POSTGRES_DB}_restore_test with its own
  # test key (volume backup-restore-test-key; never copied off-site), see
  # docs/operations.md "Restore test".
  backup:
    <<: *hardening
    profiles: ["production"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "scripts/backup_scheduler.py", "run"]
    # Not read-only: backup.sh builds the archive in a scratch directory that
    # can be as large as the uploads.
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    env_file:
      - path: .env
        required: false
    environment:
      BACKUP_DIR: /backups
      UPLOAD_DIR: /app/uploads
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-3600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-}
      BACKUP_RESTORE_TEST_INTERVAL_SECONDS: ${BACKUP_RESTORE_TEST_INTERVAL_SECONDS:-604800}
      BACKUP_RESTORE_TEST_IDENTITY: /restore-test-key/identity.txt
      BACKUP_METRICS_PORT: 9101
      # Optional off-site copy of every archive (rsync:…, rclone:… or a
      # directory); SSH key / rclone.conf come from BACKUP_OFFSITE_CONFIG_DIR.
      BACKUP_OFFSITE_TARGET: ${BACKUP_OFFSITE_TARGET:-}
      BACKUP_OFFSITE_CONFIG_DIR: /offsite-config
      BACKUP_OFFSITE_TIMEOUT_SECONDS: ${BACKUP_OFFSITE_TIMEOUT_SECONDS:-3600}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-botball}
      POSTGRES_USER: ${POSTGRES_USER:-botball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botball}
    volumes:
      - uploads:/app/uploads:ro
      # BACKUP_HOST_DIR=/data/backups stores the archives on the host (easy
      # off-site sync); by default they live in the named volume "backups".
      - ${BACKUP_HOST_DIR:-backups}:/backups
      - ${BACKUP_OFFSITE_CONFIG_DIR:-./backup-offsite}:/offsite-config:ro
      - backup-restore-test-key:/restore-test-key
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      backup-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "scripts/backup_scheduler.py", "check"]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 30m

  # ── Volume ownership (one-shot, see x-ownership-init) ────────
  volume-permissions:
    <<: *ownership-init
    command: ["10001:10001", "/app/uploads", "/app/vapid"]
    volumes:
      - uploads:/app/uploads
      - vapid:/app/vapid

  # Backup archives and the off-site credentials (SSH key, rclone.conf) must
  # belong to the backup container's user as well; ssh refuses keys it cannot
  # read or that others can read.
  backup-permissions:
    <<: *ownership-init
    profiles: ["production"]
    command: ["10001:10001", "/backups", "/offsite-config", "/restore-test-key"]
    volumes:
      - ${BACKUP_HOST_DIR:-backups}:/backups
      - ${BACKUP_OFFSITE_CONFIG_DIR:-./backup-offsite}:/offsite-config
      - backup-restore-test-key:/restore-test-key

  # ── Monitoring (profile "monitoring") ─────────────────────────
  # Prometheus and Alertmanager listen on 127.0.0.1 only; reach them through
  # an SSH tunnel (ssh -L 9090:localhost:9090 -L 9093:localhost:9093 host).
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    depends_on: [backend, blackbox, alertmanager]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  blackbox:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Host metrics (disk space of the data and backup volumes, memory, load).
  # The host's root is mounted read-only; on Proxmox LXC it is the
  # container's root file system, which is the disk that fills up.
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL metrics (up, connections, database size, deadlocks).
  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-botball}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-botball}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-botball}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Delivers Prometheus alerts. monitoring/alertmanager/render-config.sh builds
  # the config from ALERT_WEBHOOK_URL and/or ALERT_EMAIL_TO (SMTP defaults to
  # the application's SMTP_* settings).
  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.34.1
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-${SMTP_FROM:-}}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-${SMTP_USER:-}}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-${SMTP_PASSWORD:-}}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-${SMTP_TLS:-true}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - alertmanagerdata:/alertmanager
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────
  # `docker compose build frontend` builds dist/ inside Docker (Dockerfile).
  # On Proxmox LXC scripts/proxmox-setup.sh and scripts/update.sh build dist/
  # on the host instead and tag Dockerfile.prebuilt as the same image.
  frontend:
    image: botballdashboard-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # pgdata uses a bind-mount in production (path set in .env) and a plain
  # named volume in dev (variables are empty / .env absent).
  # Production .env must set:
  #   PGDATA_DRIVER_OPT_TYPE=none
  #   PGDATA_DRIVER_OPT_O=bind
  #   PGDATA_DRIVER_OPT_DEVICE=/data/db
  pgdata:
    driver: local
    driver_opts:
      type:   ${PGDATA_DRIVER_OPT_TYPE:-}
      o:      ${PGDATA_DRIVER_OPT_O:-}
      device: ${PGDATA_DRIVER_OPT_DEVICE:-}
  redisdata:
  uploads:
  letsencrypt:
  vapid:
  backups:
  # Private key of the automatic restore test (backup_scheduler.py); kept
  # apart from the archives so no backup copy carries it.
  backup-restore-test-key:
  prometheusdata:
  alertmanagerdata:
