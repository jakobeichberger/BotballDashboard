# Started with the "monitoring" compose profile (see docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: botball-api
    metrics_path: /api/system/metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: botball-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:8000/api/system/readiness"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # backup_scheduler.py in the "backup" service (compose profile "production").
  # If that profile is not running this target is down and BackupMonitoringDown
  # fires – intentionally, because then no backups are made.
  - job_name: botball-backup
    static_configs:
      - targets: ["backup:9101"]
