global:
  scrape_interval: 15s

scrape_configs:
  - job_name: botball-api
    metrics_path: /api/system/metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: botball-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:8000/api/system/readiness"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
