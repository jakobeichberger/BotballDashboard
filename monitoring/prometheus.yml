# Started with the "monitoring" compose profile (see docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: botball-api
    metrics_path: /api/system/metrics
    # The API answers text/plain without a format version; Prometheus 3
    # needs to be told which text format that is.
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["backend:8000"]
  - job_name: botball-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:8000/api/system/readiness"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # What a visitor sees: https://${DOMAIN}/ (Traefik, certificate, frontend)
  # and https://${DOMAIN}/api/system/health (Traefik → API). The targets are
  # written by monitoring/prometheus-entrypoint.sh from DOMAIN; the Blackbox
  # exporter resolves DOMAIN to the Docker host (docker-compose.yml,
  # extra_hosts). Also yields probe_ssl_earliest_cert_expiry for the
  # certificate alerts.
  - job_name: botball-external
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/prometheus/external-targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # The monitoring itself (rule evaluation, failed notifications). A dead
  # Prometheus or Alertmanager is noticed outside: the Watchdog alert goes to
  # ALERT_HEARTBEAT_URL (see monitoring/alertmanager/render-config.sh).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  # backup_scheduler.py in the "backup" service (compose profile "production").
  # If that profile is not running this target is down and BackupMonitoringDown
  # fires – intentionally, because then no backups are made.
  - job_name: botball-backup
    static_configs:
      - targets: ["backup:9101"]
  # Host disk space, memory and load (node-exporter service).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  # PostgreSQL connections, size and health (postgres-exporter service).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
