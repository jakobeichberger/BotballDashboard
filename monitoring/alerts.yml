# Prometheus alert rules for BotballDashboard. Delivered through Alertmanager
# (monitoring/alertmanager/render-config.sh, ALERT_* variables in .env).
groups:
  - name: botball-availability
    rules:
      - alert: ApiDown
        expr: up{job="botball-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BotballDashboard API is not reachable"
          description: "Prometheus cannot scrape backend:8000 for 2 minutes. Check `docker compose ps backend` and `docker compose logs backend`."

      - alert: ReadinessFailing
        expr: probe_success{job="botball-readiness"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BotballDashboard readiness check fails"
          description: "/api/system/readiness has not returned 200 for 2 minutes: PostgreSQL, Redis or the Celery worker is unavailable (OCR, push and printer polling stop without the worker)."

      - alert: HighServerErrorRate
        expr: |
          (
            sum(rate(botball_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(botball_http_requests_total[5m]))
          ) > 0.05
          and sum(rate(botball_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5 % of API requests fail with 5xx"
          description: "{{ $value | humanizePercentage }} of API requests returned a 5xx status over the last 5 minutes. Check `docker compose logs backend`."

      - alert: RedisFailOpen
        expr: sum by (component) (increase(botball_redis_fail_open_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Security checks run without Redis ({{ $labels.component }})"
          description: "Redis was unreachable, so the {{ $labels.component }} check let requests through (fail open): rate limits or revoked access tokens are not enforced. Check `docker compose logs redis`."

  - name: botball-backups
    rules:
      - alert: BackupFailed
        expr: botball_backup_last_run_success == 0
        labels:
          severity: critical
        annotations:
          summary: "The last backup run failed"
          description: "backup.sh failed; it is retried every BACKUP_RETRY_SECONDS (default 1 h). See `docker compose logs backup`."

      - alert: BackupOffsiteCopyFailed
        expr: botball_backup_offsite_last_success == 0
        labels:
          severity: critical
        annotations:
          summary: "The off-site copy of the last backup failed"
          description: "The archive exists locally but was not copied to BACKUP_OFFSITE_TARGET; the copy is retried every BACKUP_RETRY_SECONDS. See `docker compose logs backup`."

      - alert: BackupStale
        expr: time() - botball_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup for more than 26 hours"
          description: "The last successful backup is {{ $value | humanizeDuration }} old."

      - alert: BackupNeverSucceeded
        expr: botball_backup_status_known == 1 unless botball_backup_last_success_timestamp_seconds
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Backups have run but none succeeded yet"
          description: "The backup service has recorded runs but no successful backup. See `docker compose logs backup`."

      - alert: BackupMonitoringDown
        expr: up{job="botball-backup"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backup service is not running or not scraped"
          description: "backup:9101 is unreachable. Is the \"production\" compose profile enabled (COMPOSE_PROFILES=production,monitoring)?"

  - name: botball-host
    rules:
      # Real file systems only (the root disk, bind-mounted data and backup
      # directories); tmpfs and overlay layers are not what fills up.
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.15
          and node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15 % disk space left on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free. Uploads, database, logs and backups share this disk; delete old backups or grow the volume."

      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.05
          and node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5 % disk space left on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free. PostgreSQL stops accepting writes when the disk is full."

      - alert: ExporterDown
        expr: up{job=~"node|postgres"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.job }} exporter is not scraped"
          description: "{{ $labels.instance }} is unreachable, so disk or database alerts cannot fire. Check `docker compose ps` for node-exporter / postgres-exporter."

  - name: botball-postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not reachable"
          description: "postgres-exporter cannot connect to the database. Check `docker compose ps db` and `docker compose logs db`."

      - alert: PostgresConnectionsHigh
        expr: |
          sum without (datname, state, usename, application_name, backend_type, wait_event, wait_event_type)
            (pg_stat_activity_count)
          / on (instance) group_left () pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL uses more than 80 % of its connections"
          description: "{{ $value | humanizePercentage }} of max_connections are in use; new API requests or workers may fail to connect."
