server {
    listen 80;
    # This container only serves the SPA; /api/* goes to the backend through
    # Traefik, and the backend enforces MAX_UPLOAD_SIZE_MB / PRINT_UPLOAD_MAX_MB
    # itself. A proxy that forwards /api must allow the larger limit + 1 MB
    # (see docs/documentation/installation/configuration.md).
    client_max_body_size 21m;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # /api/* is routed to the backend by Traefik. Paths Traefik deliberately
    # keeps away from the backend (/api/system/metrics, /api/system/readiness)
    # end up here and must be a plain 404, not the SPA's index.html.
    location /api/ {
        return 404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # No cache for index.html (ensure fresh SW registration)
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
