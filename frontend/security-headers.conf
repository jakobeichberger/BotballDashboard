# Included by nginx.conf in the server block AND in every location that sets
# its own add_header: nginx drops all inherited add_header directives as soon
# as a location declares one, which left index.html and the JS/CSS assets
# without CSP, frame protection and HSTS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# blob: in img-src: BotImage and the export buttons render authenticated
# downloads through URL.createObjectURL.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: wss:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
