[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botball-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ─────────────────────────────────────────
    "fastapi==0.141.1",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.31",

    # ── Database ──────────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",

    # ── Validation ────────────────────────────────────────────
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.1.1",

    # ── Auth ──────────────────────────────────────────────────
    "PyJWT==2.15.0",
    "bcrypt==4.2.1",

    # ── Redis / task queue ────────────────────────────────────
    "redis[hiredis]==5.0.4",
    "celery==5.4.0",

    # ── Email ─────────────────────────────────────────────────
    "aiosmtplib==5.1.3",
    "sendgrid==6.11.0",
    "jinja2==3.1.6",

    # ── Web Push ──────────────────────────────────────────────
    "pywebpush==2.0.0",

    # ── 3D Print / encryption ─────────────────────────────────
    "cryptography==50.0.1",
    "httpx==0.27.0",
    "paho-mqtt==2.1.0",

    # ── OCR / file handling ───────────────────────────────────
    "aiofiles==23.2.1",
    "python-magic==0.4.27",
    "opencv-python-headless==4.10.0.84",
    "pytesseract==0.3.13",
    "Pillow==12.3.0",
    "qrcode==7.4.2",

    # ── Structured logging ────────────────────────────────────
    "structlog==24.1.0",

    # ── WebSocket ─────────────────────────────────────────────
    "websockets==12.0",

    # ── PDF Export ────────────────────────────────────────────
    "reportlab==4.2.0",
    # Text extraction for the paper version diff.
    "pypdf==6.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "aiosqlite==0.20.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "factory-boy==3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E712"]  # SQLAlchemy expressions require explicit boolean comparisons.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"modules/exports/pdf_builder.py" = ["E501"]
"scripts/create_admin.py" = ["E501"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["alembic/versions", "tests"]

[tool.coverage.run]
source = ["."]
# Application code only: the tests themselves, migrations and operator
# scripts (exercised by CI's migration and deployment jobs) are not counted.
omit = ["tests/*", "alembic/*", "scripts/*"]

[tool.coverage.report]
# pytest --cov fails below this. About two points under the measured total
# (Sept 2026: 77.9 %); raise it as coverage grows towards the targets
# of docs/modules/10-testing.md.
fail_under = 76
skip_empty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite signs tokens with a throwaway JWT_SECRET_KEY; production enforces
# a long secret (core.config), so PyJWT's short-key warning is only noise here.
filterwarnings = ["ignore:The HMAC key is .* below the minimum recommended length"]
