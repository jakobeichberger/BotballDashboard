[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botball-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ─────────────────────────────────────────
    "fastapi==0.141.1",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.31",

    # ── Database ──────────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",

    # ── Validation ────────────────────────────────────────────
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.1.1",

    # ── Auth ──────────────────────────────────────────────────
    "PyJWT==2.15.0",
    "bcrypt==4.2.1",

    # ── Redis / task queue ────────────────────────────────────
    "redis[hiredis]==5.0.4",
    "celery==5.4.0",

    # ── Email ─────────────────────────────────────────────────
    "aiosmtplib==5.1.3",
    "sendgrid==6.11.0",
    "jinja2==3.1.6",

    # ── Web Push ──────────────────────────────────────────────
    "pywebpush==2.0.0",

    # ── 3D Print / encryption ─────────────────────────────────
    "cryptography==50.0.1",
    "httpx==0.27.0",
    "paho-mqtt==2.1.0",

    # ── OCR / file handling ───────────────────────────────────
    "aiofiles==23.2.1",
    "python-magic==0.4.27",
    "opencv-python-headless==4.10.0.84",
    "pytesseract==0.3.13",
    "Pillow==12.3.0",
    "qrcode==7.4.2",

    # ── Structured logging ────────────────────────────────────
    "structlog==24.1.0",

    # ── WebSocket ─────────────────────────────────────────────
    "websockets==12.0",

    # ── PDF Export ────────────────────────────────────────────
    "reportlab==4.2.0",
    # Text extraction for the paper version diff.
    "pypdf==6.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "aiosqlite==0.20.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "factory-boy==3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B = bugbear, BLE = blind `except Exception`: a deliberate catch-all needs a
# `# noqa: BLE001 - <reason>` and should log what it swallows.
select = ["E", "F", "I", "UP", "B", "BLE"]
ignore = [
    "E712",  # SQLAlchemy expressions require explicit boolean comparisons.
    "B008",  # FastAPI dependencies (Depends(require_permission(...))) are argument defaults.
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"modules/exports/pdf_builder.py" = ["E501"]
"scripts/create_admin.py" = ["E501"]
"tests/conftest.py" = ["E402"]
# Fail-open Redis paths and the best-effort audit middleware catch everything
# on purpose; they are reviewed together with the Redis client and audit code.
"core/live.py" = ["BLE001"]
"core/rate_limit.py" = ["BLE001"]
"main.py" = ["BLE001"]
"modules/scoring/score_sheets/scan_routes.py" = ["BLE001"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["alembic/versions", "tests"]

[tool.coverage.run]
source = ["."]
# Application code only: the tests themselves, migrations and operator
# scripts (exercised by CI's migration and deployment jobs) are not counted.
omit = ["tests/*", "alembic/*", "scripts/*"]
# Async SQLAlchemy runs ORM code in greenlets and asyncio.to_thread in threads;
# without these, coverage misses most service code executed through them.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# pytest --cov fails below this. About two points under the measured total
# (Sept 2026: 93.5 % with greenlet/thread tracing); raise it as coverage grows
# towards the targets of docs/modules/10-testing.md.
fail_under = 91
skip_empty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Captured logs shown for failing tests; DEBUG output of every request and
# query would only slow the suite down.
log_level = "WARNING"
# The suite signs tokens with a throwaway JWT_SECRET_KEY; production enforces
# a long secret (core.config), so PyJWT's short-key warning is only noise here.
filterwarnings = ["ignore:The HMAC key is .* below the minimum recommended length"]
