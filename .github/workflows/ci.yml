name: CI

# Manual only (deliberately): start it under Actions → CI → "Run workflow"
# (any branch). Pushes and pull requests do not trigger it.
on:
  workflow_dispatch:

# A new run for the same branch cancels the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend – Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy .

  backend-test:
    name: Backend – Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # tests/conftest.py uses an in-memory SQLite database; no service needed.
      - name: Run unit + integration tests
        env:
          JWT_SECRET_KEY: test-secret-key
          APP_SECRET_KEY: test-app-secret
          PRINTER_CREDENTIAL_ENCRYPTION_KEY: ""
        # Fails below [tool.coverage.report] fail_under (pyproject.toml).
        run: pytest tests/ -n auto --tb=short --cov=. --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: ignore

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend

  backend-postgres-redis:
    name: Backend – PostgreSQL, Redis & Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: botball_test
          POSTGRES_USER: botball
          POSTGRES_PASSWORD: botball-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botball -d botball_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: botball_test
      POSTGRES_USER: botball
      POSTGRES_PASSWORD: botball-test-password
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: integration-test-jwt-secret
      APP_SECRET_KEY: integration-test-app-secret
      RUN_PLATFORM_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations on an empty database (head → 0011 → head)
        run: |
          alembic upgrade head
          alembic downgrade 0011
          alembic upgrade head
      # The data-moving parts of the migrations (0032 outbox status, 0033
      # clean-ups, 0034 aerial runs) only run when there are rows: seed the
      # e2e data plus rows for them, go down to 0030 and back, and compare
      # every table (only the downgrade losses the migrations document are
      # accepted) and the transformed values.
      - name: Migrations with data (seed, head → 0030 → head, compare)
        run: |
          python scripts/seed_e2e.py
          python scripts/migration_roundtrip.py seed
          python scripts/migration_roundtrip.py snapshot "$RUNNER_TEMP/before.json"
          alembic downgrade 0030
          alembic upgrade head
          python scripts/migration_roundtrip.py snapshot "$RUNNER_TEMP/after.json"
          python scripts/migration_roundtrip.py compare "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
      # The whole chain with data must run without errors as well (tables
      # added after 0011 lose their rows on the way down, by design).
      - name: Migrations with data (head → 0011 → head)
        run: |
          alembic downgrade 0011
          alembic upgrade head
      # Models and migrations must describe the same schema; tests/postgres/
      # test_schema_drift.py also covers partial indexes and check constraints.
      - name: Models match the migrated schema
        run: alembic check
      - name: PostgreSQL/Redis integration smoke tests
        run: pytest tests/postgres -v --tb=short

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # pip-audit also audits the runner's preinstalled pip/setuptools, which
      # lag behind security releases; bring them current first.
      - run: python -m pip install --upgrade pip setuptools
      # Audits the pinned set the images install (runtime and dev tools).
      - run: pip install pip-audit -r backend/requirements-dev.txt
      - run: pip-audit
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend audit --audit-level high

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend – Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

  frontend-test:
    name: Frontend – Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails below the thresholds in vitest.config.ts.
      - name: Run Vitest with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  frontend-build:
    name: Frontend – Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_API_URL: /api
          VITE_VAPID_PUBLIC_KEY: ""
        run: pnpm build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify generated API contract is current
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python scripts/export_openapi.py --output ../frontend/openapi.json
          cd ../frontend
          pnpm exec openapi-typescript openapi.json -o src/api/generated.ts
          git diff --exit-code -- openapi.json src/api/generated.ts

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: botball_e2e
          POSTGRES_USER: botball
          POSTGRES_PASSWORD: botball-e2e-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botball -d botball_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_DB: botball_e2e
      POSTGRES_USER: botball
      POSTGRES_PASSWORD: botball-e2e-password
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: e2e-jwt-secret
      APP_SECRET_KEY: e2e-app-secret
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      E2E_EVENT_SLUG: e2e-event
      VITE_API_URL: http://127.0.0.1:8000/api
      # Paper PDFs and print files uploaded by the flows.
      UPLOAD_DIR: ${{ github.workspace }}/.e2e-uploads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head
      # Role logins, six teams, a live public event with scores, bots, a
      # paper, a printer and a print job (backend/scripts/seed_e2e.py).
      - run: python backend/scripts/seed_e2e.py
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Type-check the specs
        run: pnpm --dir frontend e2e:typecheck
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Start application
        run: |
          mkdir -p "$UPLOAD_DIR"
          (cd backend && uvicorn main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1) &
          pnpm --dir frontend dev --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in {1..30}; do curl -fsS http://127.0.0.1:8000/api/system/health && curl -fsS http://127.0.0.1:5173 && break; sleep 2; done
      # Every spec on desktop Chromium, plus the @mobile-tagged flows
      # (navigation, scoring, offline queue) on a Pixel 7 profile.
      - name: Playwright
        run: pnpm --dir frontend e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
      - name: Application logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/uvicorn.log" || true
          tail -n 100 "$RUNNER_TEMP/vite.log" || true

  # ── Deployment ─────────────────────────────────────────────────────────────
  # Builds the real production images, starts the full compose stack (API,
  # worker, beat, frontend, Postgres, Redis, Traefik, backup, monitoring) the
  # way scripts/update.sh does on the server, and runs the same
  # scripts/verify-deployment.sh an operator runs after an install or update.
  deployment-smoke:
    name: Deployment – full stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: bbci
      FRONTEND_BUILD: docker
    steps:
      - uses: actions/checkout@v7
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Generate a production .env
        run: |
          age-keygen -o "$RUNNER_TEMP/backup-identity.txt" 2>/dev/null
          python3 scripts/ci-generate-env.py "$RUNNER_TEMP/backup-identity.txt"
      - name: Build and start the stack
        run: scripts/update.sh --no-pull
      - name: Create the VAPID key
        run: make vapid-keys
      - name: Take a backup
        run: make backup-now
      # Decrypts the new archive with the private age identity, restores it
      # into ${POSTGRES_DB}_restore_test and checks every upload against the
      # manifest (docs/operations.md, "Restore test").
      - name: Restore-test the backup
        run: |
          archive="$(docker compose exec -T backup sh -c 'ls -1t /backups/*.tar.gz.age | head -n1' | tr -d '\r')"
          test -n "$archive"
          # The backup container runs as uid 10001 and cannot read the
          # runner's 0600 identity; hand it a copy it owns (docs/operations.md).
          work="$RUNNER_TEMP/restore-work"
          sudo install -d -m 700 -o 10001 -g 10001 "$work"
          sudo install -m 400 -o 10001 -g 10001 "$RUNNER_TEMP/backup-identity.txt" "$work/age-identity"
          trap 'sudo rm -rf "$work"' EXIT
          # Through the scheduler, so the result is recorded (metrics, alert).
          docker compose run --rm --no-deps \
            -v "$work:/restore-work" -e AGE_IDENTITY=/restore-work/age-identity \
            backup python scripts/backup_scheduler.py restore-test "$archive"
      # The same archive with the scheduler's own test key (weekly automatic
      # restore test, docs/operations.md).
      - name: Automatic restore test with the server-side test key
        run: |
          archive="$(docker compose exec -T backup sh -c 'ls -1t /backups/*.tar.gz.age | head -n1' | tr -d '\r')"
          docker compose exec -T backup python scripts/backup_scheduler.py restore-test "$archive"
          docker compose exec -T backup cat /backups/status/restore-test.json
      - name: Verify the deployment
        run: scripts/verify-deployment.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Updates a running installation of the previous release WITH data to this
  # commit the way an operator does (scripts/update.sh: verified backup,
  # migrations, restart, verify-deployment.sh), checks that no row was lost,
  # then rolls back with scripts/update.sh --rollback (previous images, no
  # rebuild, migrations down) and checks again. Previous release = the
  # merge base with main, or the parent commit when this is main itself.
  deployment-update:
    name: Deployment – update from the previous release with data, rollback
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: bbup
      FRONTEND_BUILD: docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Pick the previous release
        id: previous
        run: |
          git fetch --quiet origin main || true
          base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Previous release: $(git log -1 --format='%h %s' "$base")"
      - name: Generate a production .env
        run: |
          age-keygen -o "$RUNNER_TEMP/backup-identity.txt" 2>/dev/null
          python3 scripts/ci-generate-env.py "$RUNNER_TEMP/backup-identity.txt"
      - name: Install the previous release
        run: |
          git worktree add "$RUNNER_TEMP/previous" "${{ steps.previous.outputs.sha }}"
          cp .env "$RUNNER_TEMP/previous/.env"
          cd "$RUNNER_TEMP/previous"
          scripts/update.sh --no-pull
      - name: Seed data into the previous release
        run: |
          cd "$RUNNER_TEMP/previous"
          docker compose exec -T -e APP_ENV=development backend python scripts/seed_e2e.py
          # Snapshot with this commit's helper (the previous image may not have it).
          docker compose exec -T backend python - snapshot /tmp/before.json \
            < "$GITHUB_WORKSPACE/backend/scripts/migration_roundtrip.py"
          docker compose exec -T backend cat /tmp/before.json > "$RUNNER_TEMP/before.json"
      - name: Update to this commit (scripts/update.sh)
        run: scripts/update.sh --no-pull
      - name: No rows lost by the update
        run: |
          grep -E '^(PREVIOUS_|CURRENT_IMAGE_TAG|PRE_UPDATE_BACKUP)' .deploy-state
          docker compose exec -T backend python scripts/migration_roundtrip.py snapshot /tmp/after.json
          docker compose exec -T backend cat /tmp/after.json > "$RUNNER_TEMP/after.json"
          python3 backend/scripts/migration_roundtrip.py compare --update "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
      - name: Roll back without rebuilding (scripts/update.sh --rollback)
        run: |
          cp backend/scripts/migration_roundtrip.py "$RUNNER_TEMP/migration_roundtrip.py"
          # Checks out the previous commit, re-tags its images, migrates down.
          scripts/update.sh --rollback
          git log -1 --format='now at %h %s'
      - name: No rows lost by the rollback
        run: |
          docker compose exec -T backend python - snapshot /tmp/rolled-back.json \
            < "$RUNNER_TEMP/migration_roundtrip.py"
          docker compose exec -T backend cat /tmp/rolled-back.json > "$RUNNER_TEMP/rolled-back.json"
          python3 "$RUNNER_TEMP/migration_roundtrip.py" compare --update "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/rolled-back.json"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
